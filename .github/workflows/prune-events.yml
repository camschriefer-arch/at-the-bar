name: Drop expired behaviour events

# The retention window in the privacy policy is only a promise until something
# enforces it. Nothing in the app calls prune_app_events(), and a job that runs
# alongside the monthly catalog import would leave events standing for weeks
# past their window and skip the deletion entirely whenever that import failed.
on:
  schedule:
    # 03:00 UTC daily, so no event outlives its window by more than a day.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete events past the retention window
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/prune_app_events" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            -d '{}'
