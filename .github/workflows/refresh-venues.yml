name: Refresh venue catalog

# Venues open and close constantly, so the catalog is re-imported monthly from
# the newest Overture Maps release. The import is keyed on (source, source_id),
# so a run only refreshes rows.
on:
  schedule:
    # 04:00 UTC on the 1st of each month, i.e. the middle of the night in the US.
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma separated US states to refresh (default: all)'
        required: false
        type: string
      country:
        description: 'ISO country code to refresh, e.g. ES (default: US)'
        required: false
        type: string

jobs:
  import:
    runs-on: ubuntu-latest
    # One DuckDB pass over the whole country, so no chunking and no throttling.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install duckdb

      - name: Import venues
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATES: ${{ inputs.states }}
          COUNTRY: ${{ inputs.country }}
        run: |
          set -e
          if [ -n "$STATES" ]; then
            python3 scripts/import_places.py --states "$STATES"
          elif [ -n "$COUNTRY" ]; then
            python3 scripts/import_places.py --country "$COUNTRY"
          else
            # The scheduled run refreshes every country the app covers.
            for country in US ES; do
              python3 scripts/import_places.py --country "$country"
            done
          fi
